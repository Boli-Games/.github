<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 480" role="img" aria-label="Boli  Escondite entre la manada">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1f28"/>
      <stop offset="55%" stop-color="#12151a"/>
      <stop offset="100%" stop-color="#0c0e12"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a3128" stop-opacity="0"/>
      <stop offset="100%" stop-color="#3d4634" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="42%" r="28%">
      <stop offset="0%" stop-color="#e4d2b2" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#e4d2b2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1440" height="480" fill="url(#sky)"/>
  <rect width="1440" height="480" fill="url(#glow)"/>
  <rect y="300" width="1440" height="180" fill="url(#ground)"/>

  <!-- distant herd silhouettes -->
  <g fill="#e4d2b2" opacity="0.22">
    <g transform="translate(90,330) scale(0.55)">
      <circle cx="16" cy="13" r="7"/><rect x="11" y="20" width="10" height="8" rx="3"/>
    </g>
    <g transform="translate(150,338) scale(0.5)">
      <circle cx="16" cy="13" r="7"/><rect x="11" y="20" width="10" height="8" rx="3"/>
    </g>
    <g transform="translate(210,326) scale(0.62)">
      <circle cx="16" cy="13" r="7"/><rect x="11" y="20" width="10" height="8" rx="3"/>
    </g>
    <g transform="translate(270,340) scale(0.48)">
      <circle cx="16" cy="13" r="7"/><rect x="11" y="20" width="10" height="8" rx="3"/>
    </g>
    <g transform="translate(330,332) scale(0.58)">
      <circle cx="16" cy="13" r="7"/><rect x="11" y="20" width="10" height="8" rx="3"/>
    </g>
    <g transform="translate(390,344) scale(0.45)">
      <circle cx="16" cy="13" r="7"/><rect x="11" y="20" width="10" height="8" rx="3"/>
    </g>
    <g transform="translate(980,328) scale(0.55)">
      <circle cx="16" cy="13" r="7"/><rect x="11" y="20" width="10" height="8" rx="3"/>
    </g>
    <g transform="translate(1040,336) scale(0.5)">
      <circle cx="16" cy="13" r="7"/><rect x="11" y="20" width="10" height="8" rx="3"/>
    </g>
    <g transform="translate(1100,322) scale(0.64)">
      <circle cx="16" cy="13" r="7"/><rect x="11" y="20" width="10" height="8" rx="3"/>
    </g>
    <g transform="translate(1165,340) scale(0.48)">
      <circle cx="16" cy="13" r="7"/><rect x="11" y="20" width="10" height="8" rx="3"/>
    </g>
    <g transform="translate(1225,330) scale(0.57)">
      <circle cx="16" cy="13" r="7"/><rect x="11" y="20" width="10" height="8" rx="3"/>
    </g>
    <g transform="translate(1285,344) scale(0.46)">
      <circle cx="16" cy="13" r="7"/><rect x="11" y="20" width="10" height="8" rx="3"/>
    </g>
  </g>

  <!-- hero boli -->
  <g transform="translate(1080,145) scale(4.2)">
    <circle cx="16" cy="13" r="7" fill="#e4d2b2"/>
    <rect x="11" y="20" width="10" height="8" rx="3" fill="#c9b48a"/>
    <circle cx="13.5" cy="12" r="1.1" fill="#12151a"/>
    <circle cx="18.5" cy="12" r="1.1" fill="#12151a"/>
  </g>

  <!-- brand + tagline -->
  <text x="96" y="210" fill="#f3ead2" font-family="Georgia, 'Times New Roman', serif" font-size="96" font-weight="700" letter-spacing="4">Boli</text>
  <text x="100" y="268" fill="#c9b48a" font-family="'Segoe UI', system-ui, sans-serif" font-size="28" letter-spacing="1.5">Escondite entre la manada</text>
  <text x="100" y="312" fill="#8a8274" font-family="'Segoe UI', system-ui, sans-serif" font-size="20">Un cazador. El resto, bolis.</text>
